name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install terminal test prerequisites
        run: sudo apt-get update && sudo apt-get install -y tmux python3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - run: bash -n scripts/install.sh
      - run: bun run check
      - name: Stress test Agy terminal reconnect
        shell: bash
        run: |
          for attempt in {1..20}; do
            echo "Agy reconnect attempt $attempt/20"
            bun test tests/embedded-process.test.ts --test-name-pattern 'Agy terminal keeps working'
          done
      - name: Smoke test isolated CLI startup
        shell: bash
        run: |
          smoke_root=$(mktemp -d)
          trap 'rm -rf -- "$smoke_root"' EXIT
          export XDG_CONFIG_HOME="$smoke_root/config"
          export XDG_DATA_HOME="$smoke_root/data"
          export XDG_CACHE_HOME="$smoke_root/cache"
          bun src/index.ts --help
          bun src/index.ts --version
          bun src/index.ts paths
          bun src/index.ts projects list

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Audit dependencies
        shell: bash
        run: |
          started=$SECONDS
          set +e
          timeout --kill-after=5s 120s bun audit --json > audit.stdout.json 2> audit.stderr.log
          status=$?
          set -e
          cat audit.stdout.json
          cat audit.stderr.log >&2
          echo "Dependency audit finished in $((SECONDS - started))s with exit status $status."
          if [[ "$status" == 124 || "$status" == 137 ]]; then
            echo "::error::Dependency audit exceeded two minutes; check access to registry.npmjs.org."
          elif [[ "$status" != 0 ]]; then
            echo "::error::Dependency audit failed; inspect the advisory report or registry error above."
          fi
          exit "$status"
